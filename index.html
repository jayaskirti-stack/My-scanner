<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Market Analysis</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}header{padding:22px 26px;border-bottom:1px solid #26364c;background:#0b1728}h1{margin:0;font-size:25px}.subtitle{margin-top:6px;color:#9fb0c7;font-size:13px}.app{display:flex;min-height:calc(100vh - 84px)}aside{width:235px;padding:22px 16px;border-right:1px solid #26364c;background:#0a1423}button{width:100%;padding:14px;margin-bottom:12px;border:1px solid #34506e;border-radius:10px;background:#13263d;color:white;font-size:15px;font-weight:700;text-align:left;cursor:pointer}button:hover{background:#193451}button.active{background:#17345a;border-color:#6da8ff}button:disabled{opacity:.65;cursor:wait}main{flex:1;min-width:0;padding:26px}.card{max-width:1100px;background:#0d1b2d;border:1px solid #26364c;border-radius:14px;padding:24px}h2{margin-top:0}.muted{color:#9fb0c7}.status{margin-top:20px;padding:15px;border-radius:10px;background:#101f33;border:1px solid #26364c}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#142b47;color:#b9d5ff;font-size:12px;margin-bottom:12px}.table-wrap{overflow-x:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:510px}th,td{text-align:right;padding:12px;border-bottom:1px solid #26364c;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:#b9d5ff;font-size:13px}a{color:#aad1ff}.note{font-size:13px;line-height:1.5}@media(max-width:650px){.app{display:block}aside{width:100%;border-right:0;border-bottom:1px solid #26364c;padding:12px;display:flex;gap:10px}aside button{margin:0}main{padding:16px}.card{padding:17px}}
</style>
</head>
<body>
<header><h1>Stock Market Analysis</h1><div class="subtitle">Nifty 500 daily scanner</div></header>
<div class="app"><aside><button id="ma44" type="button" class="active">44 MA</button><button id="leader" type="button">Market Leader</button></aside>
<main><section class="card"><div class="badge" id="badge">Daily Scanner</div><h2 id="heading">44 MA Scanner</h2><p id="description" class="muted">Rising 44 SMA, green daily candle, close above SMA and within 1%.</p><div id="status" class="status" role="status" aria-live="polite">44 MA button dabakar latest available scan dekhein.</div><div id="results"></div></section></main></div>
<script>
const ma44=document.getElementById('ma44'),leader=document.getElementById('leader'),heading=document.getElementById('heading'),description=document.getElementById('description'),status=document.getElementById('status'),badge=document.getElementById('badge'),results=document.getElementById('results');
const money=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function cell(row,value){const td=document.createElement('td');td.textContent=value;row.append(td)}
ma44.onclick=async()=>{
 ma44.classList.add('active');leader.classList.remove('active');badge.textContent='Daily Scanner';heading.textContent='44 MA Scanner';description.textContent='Rising 44 SMA, green daily candle, close above SMA and within 1%.';results.replaceChildren();status.textContent='Latest daily scan load ho raha hai…';ma44.disabled=true;
 try{
  const response=await fetch('./scan-results.json?refresh='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('Scan data abhi publish nahi hua (HTTP '+response.status+').');
  const data=await response.json();
  if(!data.as_of||!Array.isArray(data.matches))throw new Error('Scan data format galat hai.');
  status.textContent=`Daily candle: ${data.as_of} · ${data.latest_candle_count} / ${data.universe_count} stocks latest date par · ${data.matches.length} matches`;
  if(!data.matches.length){results.textContent='Is daily candle par koi stock in conditions ko match nahi karta.';return}
  const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');const head=document.createElement('tr');['Symbol','Close (₹)','44 SMA (₹)','Distance %'].forEach(x=>{const th=document.createElement('th');th.textContent=x;head.append(th)});table.append(head);
  for(const item of data.matches){const row=document.createElement('tr');cell(row,item.symbol);cell(row,money.format(item.close));cell(row,money.format(item.ma44));cell(row,money.format(item.distance_pct)+'%');table.append(row)}wrap.append(table);results.append(wrap);
  const note=document.createElement('p');note.className='muted note';note.textContent=`Last generated: ${new Date(data.generated_at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})} IST. Scan latest available completed daily candle par based hai; live intraday quote nahi.`;results.append(note);
 }catch(error){status.textContent='Scanner load nahi hua: '+error.message+' Thodi der baad phir try karein.'}
 finally{ma44.disabled=false}
};
leader.onclick=()=>{leader.classList.add('active');ma44.classList.remove('active');badge.textContent='Back-test Lab';heading.textContent='Market Leader';description.textContent='Market-leader parameters and back-test will be added here.';status.textContent='Abhi koi Market Leader parameter active nahi hai.';results.replaceChildren()};
</script>
</body></html>
