name: Daily Nifty 500 scan
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/scan.py
      - .github/workflows/daily-scan.yml
  schedule:
    - cron: '30 11 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yfinance>=0.2.60,<2'
      - run: python scripts/scan.py
      - name: Publish scan snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scan-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Nifty 500 daily scan"
            git push
          fi
