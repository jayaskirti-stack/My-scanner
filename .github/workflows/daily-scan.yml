name: Daily Nifty 500 scan
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/scan.py
      - scripts/leader.py
      - scripts/leader-reviews.json
      - .github/workflows/daily-scan.yml
  schedule:
    - cron: '30 11 * * 1-5'
concurrency:
  group: daily-scanner-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yfinance>=0.2.60,<2' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/scan.py
      - name: Publish scan snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scan-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Nifty 500 daily scan"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - run: python scripts/leader.py
      - name: Publish market leader shortlist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add leader-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market leader shortlist"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
